name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同時実行を 1 本に制限する (gh-pages への push が競合しないようにするため)
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # peaceiris/actions-gh-pages が gh-pages ブランチへ push するために必要
      contents: write

    # ランナーのシステム Python には tkinter が含まれず、autodoc が gui.py を
    # import できない。uv が管理する Python (tkinter 同梱) の使用を強制する
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # autodoc が gui.py を import するため tkinter が必要
      - name: Check tkinter availability
        run: |
          uv run python -c "import sys, tkinter, tkinterdnd2, _tkinter; print(sys.version); print(sys.executable); print('Tk', _tkinter.TK_VERSION)"

      - name: Build documentation
        run: uv run sphinx-build -M html docs/sphinx/source docs/sphinx/build -W --keep-going

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/sphinx/build/html

      # gh-pages ブランチを毎回作り直すことで、過去ビルドの残骸を残さない
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/sphinx/build/html
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: deploy ${{ github.sha }}"
