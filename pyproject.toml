# see https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# see https://docs.astral.sh/uv/

# ビルドシステムの指定をすると uv sync で自動でリポジトリをインストール
# see https://docs.astral.sh/uv/concepts/projects/config/#build-systems
[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video_converter"
requires-python = "==3.12.*"
version = "0.1.0"
description = "Python CLI (Fire) and GUI (Tkinter) interface examples for ffmpeg-python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "applejxd" }]
dependencies = [
    # interfaces
    "fire",
    "tqdm",
    "tkinterdnd2",
    # libraries
    "gevent",
    "ffmpeg-python",
]

# 実行ファイルの作成にのみ必要なため、任意の依存として分離する
[project.optional-dependencies]
build = ["pyinstaller"]

[project.scripts]
video-converter = "video_converter.__main__:main"

[project.urls]
Homepage = "https://github.com/applejxd/VideoConverter"
Documentation = "https://applejxd.github.io/VideoConverter/"

# sphinx, sphinx-rtd-theme の互換性に注意
[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "sphinx>=8.2,<9",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-mdinclude>=0.6.2",
    "sphinx-rtd-theme>=1.3.0",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# anyio の pytest プラグインは ssl を先に import してしまい、
# conftest.py の gevent monkey patch より先回りして警告を出すため無効化する
addopts = "-p no:anyio"
